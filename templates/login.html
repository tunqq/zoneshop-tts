<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ZONE SHOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin-bottom: 15px;
        }
        .logo h1 {
            color: #f1f5f9;
            font-size: 24px;
        }
        .logo p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f1f5f9;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        label i { color: #94a3b8; }
        input {
            width: 100%;
            padding: 14px 16px;
            background: #334155;
            border: 2px solid #475569;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 15px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #6366f1;
        }
        input::placeholder {
            color: #64748b;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #6366f1;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body { padding: 15px; }
            .login-card { padding: 25px 20px; border-radius: 16px; }
            .logo-icon { width: 50px; height: 50px; font-size: 20px; border-radius: 12px; margin-bottom: 12px; }
            .logo h1 { font-size: 20px; }
            .logo p { font-size: 12px; }
            .logo { margin-bottom: 25px; }
            .form-group { margin-bottom: 16px; }
            label { font-size: 13px; margin-bottom: 6px; }
            input { padding: 12px 14px; font-size: 14px; border-radius: 8px; }
            .btn { padding: 12px; font-size: 14px; border-radius: 8px; }
            .error { padding: 10px; font-size: 12px; }
            .links { font-size: 12px !important; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-microphone-alt"></i></div>
            <h1>ZONE SHOP</h1>
            <p>Text to Speech</p>
        </div>
        
        {% if error %}
        <div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Tên đăng nhập</label>
                <input type="text" name="username" placeholder="Nhập username" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Mật khẩu</label>
                <input type="password" name="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
        </form>
        
        <div class="links" style="color:#64748b;font-size:13px;">
            <i class="fas fa-info-circle"></i> Liên hệ Admin để được cấp tài khoản
        </div>
    </div>
</body>
</html>
